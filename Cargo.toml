[workspace]
resolver = "2"
members = [
    "contracts/accessories/*",
    "contracts/main/*",
    "packages/polytone-evm",
    "scripts",
]
exclude = [
    "contracts/main/note",
    "contracts/main/proxy",
    "contracts/main/voice",
    "packages/cw-orch-polytone",
    "packages/polytone",
]

[workspace.package]
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/DA0-DA0/polytone"
rust-version = "1.67"
version = "3.0.0-rc"

[workspace.dependencies]
cw-orch-polytone = { package = "abstract-cw-orch-polytone", path = "../polytone/packages/cw-orch-polytone" }
polytone = { package = "abstract-polytone", path = "../polytone/packages/polytone" }
polytone-evm = { path = "packages/polytone-evm" }
polytone-note = { package = "abstract-polytone-note", path = "../polytone/contracts/main/note" }
polytone-proxy = { package = "abstract-polytone-proxy", path = "../polytone/contracts/main/proxy" }
polytone-voice = { package = "abstract-polytone-voice", path = "../polytone/contracts/main/voice" }

cosmwasm-schema = { path = "../cosmwasm/packages/schema" }
cosmwasm-std = { path = "../cosmwasm/packages/std" }
cw-storage-plus = { path = "../cw-storage-plus" }
cw-utils = { path = "../cw-minus/packages/cw-utils" }
cw2 = { path = "../cw-minus/packages/cw2" }

serde = { version = "1.0.145", default-features = false, features = ["derive"] }
sha2 = "0.10.6"
thiserror = "1.0.31"
# dev-dependencies

anyhow = { version = "1.0.51" }
cw-multi-test = { package = "abstract-cw-multi-test", path = "../cw-multi-test-fork" }
cw-orch = { path = "../cw-orchestrator/cw-orch" }
cw-orch-interchain = { path = "../cw-orchestrator/cw-orch-interchain" }

[patch.crates-io]
blst = { package = "nam-blst", path = "../blst/bindings/rust", version = "0.3.17-nam.0" }
alloy = {path = "../alloy/crates/alloy"}

[patch.'https://github.com/permissionlessweb/polytone']
evm-note = { path = "contracts/main/evm-note" }
polytone-evm = { path = "packages/polytone-evm" }



[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = true   # very important, do not turn these off.
panic = 'abort'
rpath = false
