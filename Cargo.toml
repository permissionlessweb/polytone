[workspace]
members = [
  "packages/*",
  "contracts/accessories/*",
  "contracts/main/*",
  "scripts",
]

[workspace.package]
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/DA0-DA0/polytone"
rust-version = "1.67"
version = "3.0.0-rc"

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = true   # very important, do not turn these off.
panic = 'abort'
rpath = false

[workspace.dependencies]
polytone = { package = "abstract-polytone", path = "packages/polytone" }
polytone-proxy = { package = "abstract-polytone-proxy", path = "contracts/main/proxy" }
polytone-note = { package = "abstract-polytone-note", path = "contracts/main/note" }
polytone-voice = { package = "abstract-polytone-voice", path = "contracts/main/voice" }
cw-orch-polytone = { package = "abstract-cw-orch-polytone", path = "packages/cw-orch-polytone" }

cosmwasm-schema = "3.0.4"
cosmwasm-std = { version = "3.0.4", features = ["stargate"] }
cw-storage-plus = "3.0.1"
cw-utils = { path = "../cw-minus/packages/cw-utils" }
cw2 = { path = "../cw-minus/packages/cw2" }

serde = { version = "1.0.145", default-features = false, features = ["derive"] }
thiserror = "1.0.31"
# the sha2 version here is the same as the one used by
# cosmwasm-std. when bumping cosmwasm-std, this should also be
# updated. to find cosmwasm_std's sha function:
# ```cargo tree --package cosmwasm-std```
sha2 = "0.10.6"

# dev-dependencies
cw-orch = { path = "../cw-orchestrator/cw-orch" }
cw-orch-interchain = { path = "../cw-orchestrator/cw-orch-interchain" }

cw-multi-test = "3.0.0"
anyhow = { version = "1.0.51" }
