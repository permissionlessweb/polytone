[workspace]
members = [
    "contracts/accessories/*",
    "contracts/main/*",
    "packages/*",
    "scripts",
]

[workspace.package]
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/DA0-DA0/polytone"
rust-version = "1.67"
version = "3.0.0-rc"

[workspace.dependencies]
cw-orch-polytone = { path = "packages/cw-orch-polytone", package = "abstract-cw-orch-polytone" }
polytone = { path = "packages/polytone", package = "abstract-polytone" }
polytone-note = { path = "contracts/main/note", package = "abstract-polytone-note" }
polytone-proxy = { path = "contracts/main/proxy", package = "abstract-polytone-proxy" }
polytone-voice = { path = "contracts/main/voice", package = "abstract-polytone-voice" }

cosmwasm-schema = { version = "=4.1.0" }
cosmwasm-std = { version = "=4.1.0" }
cw-storage-plus = { version = "3.0.1" }
cw-utils = { version = "3.0.0" }
cw2 = { version = "3.0.0" }

serde = { version = "1.0.145", default-features = false, features = ["derive"] }
# the sha2 version here is the same as the one used by
# cosmwasm-std. when bumping cosmwasm-std, this should also be
# updated. to find cosmwasm_std's sha function:
# ```cargo tree --package cosmwasm-std```
sha2 = "0.10.6"
thiserror = "1.0.31"

# dev-dependencies
cw-orch = { version = "0.30.0" }
cw-orch-interchain = { version = "0.8.0" }

anyhow = { version = "1.0.51" }
cw-multi-test = { package = "abstract-cw-multi-test", version = "=3.0.0-rc" }
[patch.crates-io]

ibc-relayer-types = { path = "../hermes/crates/relayer-types" }

ibc-chain-registry = { path = "../hermes/crates/chain-registry" }
ibc-proto = { path = "../ibc-proto-rs" }
zk-cosmwasm = { path = "../cosmwasm/packages/zk" }
cnidarium = { path = "../cnidarium" }
ibc-types = { path = "../ibc-types/crates/ibc-types" }
ics23 = { path = "../ics23/rust" }
jmt = { path = "../jmt" }
tower-abci = { path = "../tower-abci" }

abstract-cw-multi-test = { git = "https://github.com/permissionlessweb/cw-multi-test-fork", rev = "2eb14e1f0b66caed897a3c4a69a4c57282b565c0" }
cosmos-sdk-proto = { git = "https://github.com/permissionlessweb/cosmos-rust", rev = "877ee79b693760f7ffa97ef542f5788c26f537dd" }
cw-orch = { git = "https://github.com/permissionlessweb/cw-orchestrator", rev = "99f8a568fe733735579b891c1dc47c97e4c8960d" }
cw-orch-interchain = { git = "https://github.com/permissionlessweb/cw-orchestrator", rev = "99f8a568fe733735579b891c1dc47c97e4c8960d" }
cw-storage-plus = { git = "https://github.com/permissionlessweb/cw-storage-plus", rev = "b303f445113c95427b57fc825bc033fdf3e6fee0" }
cw-utils = { git = "https://github.com/permissionlessweb/cw-minus", rev = "14194672e846a56e5a37a4a3b449e375f6f2b496" }
cw2 = { git = "https://github.com/permissionlessweb/cw-minus", rev = "14194672e846a56e5a37a4a3b449e375f6f2b496" }
tendermint-proto = { git = "https://github.com/permissionlessweb/tendermint-rs", rev = "c732393410cefadb53da98836a7620ef1a1ef8bb" }
cw1 = { git = "https://github.com/permissionlessweb/cw-plus", rev = "f66883649c08d2671cc7d66cdf4f7f6abec4e44d" }
cw1-whitelist = { git = "https://github.com/permissionlessweb/cw-plus", rev = "f66883649c08d2671cc7d66cdf4f7f6abec4e44d" }
cosmrs = { git = "https://github.com/permissionlessweb/cosmos-rust", rev = "877ee79b693760f7ffa97ef542f5788c26f537dd" }
tendermint = { git = "https://github.com/permissionlessweb/tendermint-rs", rev = "c732393410cefadb53da98836a7620ef1a1ef8bb" }
tendermint-rpc = { git = "https://github.com/permissionlessweb/tendermint-rs", rev = "c732393410cefadb53da98836a7620ef1a1ef8bb" }
cw20-ics20 = { git = "https://github.com/permissionlessweb/cw-plus", rev = "f66883649c08d2671cc7d66cdf4f7f6abec4e44d" }
cw-controllers = { git = "https://github.com/permissionlessweb/cw-minus", rev = "14194672e846a56e5a37a4a3b449e375f6f2b496" }
tendermint-light-client-verifier = { git = "https://github.com/permissionlessweb/tendermint-rs", rev = "c732393410cefadb53da98836a7620ef1a1ef8bb" }
cosmwasm-schema = { git = "https://github.com/permissionlessweb/cosmwasm", rev = "e20646e2d9a9c4f93e993eb0656afa795f6e387a" }
cosmwasm-std = { git = "https://github.com/permissionlessweb/cosmwasm", rev = "e20646e2d9a9c4f93e993eb0656afa795f6e387a" }
informalsystems-pbjson = { git = "https://github.com/permissionlessweb/pbjson", rev = "df9ae64ffc106affccdfec2437365f8498ef306d" }
[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = true   # very important, do not turn these off.
panic = 'abort'
rpath = false
