[workspace]
members = [
    "contracts/accessories/*",
    "contracts/main/*",
    "packages/*",
    "scripts",
]

[workspace.package]
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/DA0-DA0/polytone"
rust-version = "1.67"
version = "3.0.0-rc"

[workspace.dependencies]
cw-orch-polytone = { path = "packages/cw-orch-polytone", package = "abstract-cw-orch-polytone" }
polytone = { path = "packages/polytone", package = "abstract-polytone" }
polytone-note = { path = "contracts/main/note", package = "abstract-polytone-note" }
polytone-proxy = { path = "contracts/main/proxy", package = "abstract-polytone-proxy" }
polytone-voice = { path = "contracts/main/voice", package = "abstract-polytone-voice" }

cosmwasm-schema = { git = "https://github.com/permissionlessweb/cosmwasm", rev = "e20646e2d9a9c4f93e993eb0656afa795f6e387a" }
cosmwasm-std = { git = "https://github.com/permissionlessweb/cosmwasm", rev = "e20646e2d9a9c4f93e993eb0656afa795f6e387a" }
cw-storage-plus = { git = "https://github.com/permissionlessweb/cw-storage-plus", rev = "cf066f8ca57cc30a7cf8f50fca9cf6e18291d71a" }
cw-utils = { git = "https://github.com/permissionlessweb/cw-minus", rev = "c5c680ddc3d896cc746618d7ad9b93e0f8271461" }
cw2 = { git = "https://github.com/permissionlessweb/cw-minus", rev = "c5c680ddc3d896cc746618d7ad9b93e0f8271461" }

serde = { version = "1.0.145", default-features = false, features = ["derive"] }
# the sha2 version here is the same as the one used by
# cosmwasm-std. when bumping cosmwasm-std, this should also be
# updated. to find cosmwasm_std's sha function:
# ```cargo tree --package cosmwasm-std```
sha2 = "0.10.6"
thiserror = "1.0.31"

# dev-dependencies
cw-orch = { git = "https://github.com/permissionlessweb/cw-orchestrator", rev = "ec4d693aad80ee70ddbd77c3b78c9807bedb6be0" }
cw-orch-interchain = { git = "https://github.com/permissionlessweb/cw-orchestrator", rev = "ec4d693aad80ee70ddbd77c3b78c9807bedb6be0" }

anyhow = { version = "1.0.51" }
cw-multi-test = { package = "abstract-cw-multi-test", git = "https://github.com/permissionlessweb/cw-multi-test-fork", rev = "cbf6c519e16840ba2454553ff117f482d539b4cd" }

[patch."https://github.com/permissionlessweb/cw-orchestrator"]
cw-orch = { path = "../cw-orchestrator/cw-orch" }
cw-orch-interchain = { path = "../cw-orchestrator/cw-orch-interchain" }
cw-orch-core = { path = "../cw-orchestrator/packages/cw-orch-core" }
cw-orch-daemon = { path = "../cw-orchestrator/cw-orch-daemon" }
cw-orch-mock = { path = "../cw-orchestrator/packages/cw-orch-mock" }
cw-orch-networks = { path = "../cw-orchestrator/packages/cw-orch-networks" }
cw-orch-traits = { path = "../cw-orchestrator/packages/cw-orch-traits" }
cw-orch-interchain-core = { path = "../cw-orchestrator/packages/interchain/interchain-core" }
cw-orch-interchain-daemon = { path = "../cw-orchestrator/packages/interchain/interchain-daemon" }
cw-orch-interchain-mock = { path = "../cw-orchestrator/packages/interchain/interchain-mock" }
cw-orch-starship = { path = "../cw-orchestrator/packages/interchain/starship" }

[patch.'https://github.com/permissionlessweb/cosmwasm']
cosmwasm-schema = { path = "../cosmwasm/packages/schema" }
cosmwasm-std = { path = "../cosmwasm/packages/std" }

[patch.'https://github.com/permissionlessweb/cw-storage-plus']
cw-storage-plus = { path = "../cw-storage-plus" }

[patch.'https://github.com/permissionlessweb/cw-minus']
cw-utils = { path = "../cw-minus/packages/cw-utils" }
cw2 = { path = "../cw-minus/packages/cw2" }

[patch.'https://github.com/permissionlessweb/cw-multi-test-fork']
abstract-cw-multi-test = { path = "../cw-multi-test-fork" }

[patch.'https://github.com/permissionlessweb/polytone']
abstract-cw-orch-polytone = { path = "packages/cw-orch-polytone" }
abstract-polytone = { path = "packages/polytone" }
abstract-polytone-note = { path = "contracts/main/note" }
abstract-polytone-proxy = { path = "contracts/main/proxy" }
abstract-polytone-voice = { path = "contracts/main/voice" }

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = true   # very important, do not turn these off.
panic = 'abort'
rpath = false
