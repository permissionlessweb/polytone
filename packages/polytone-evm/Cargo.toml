[package]
name = "polytone-evm"
authors = ["ekez <ekez@withoutdoing.com>"]
description = "Core interfaces for Polytone Interchain accounts and queries."
edition = "2021"
license = "BSD-3-Clause"
version = "2.0.0"

include = ["src", "solidity/foundry.toml", "solidity/src", "solidity/out"]

[lib]

[features]
bind = ["alloy/contract"]

[build-dependencies]
foundry-compilers = { version = "0.11.1", features = ["svm-solc"] }
foundry-config = "0.2.0"

[dependencies]
cosmwasm-schema = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "mvp" }
cosmwasm-std = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "mvp", features = ["stargate"] }
cw-storage-plus = { git = "https://github.com/permissionlessweb/cw-storage-plus", branch = "mvp" }
cw-utils = { git = "https://github.com/permissionlessweb/cw-minus", branch = "main" }
cw2 = { git = "https://github.com/permissionlessweb/cw-minus", branch = "main" }
thiserror = "1.0.31"
alloy = "1.0.25"    
alloy-sol-types = "1.3.1"  

cw-asset = { git = "https://github.com/permissionlessweb/cw-asset", branch = "main" }