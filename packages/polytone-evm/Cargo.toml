[package]
name = "polytone-evm"
authors = ["ekez <ekez@withoutdoing.com>"]
description = "Core interfaces for Polytone Interchain accounts and queries."
edition = "2021"
license = "BSD-3-Clause"
version = "2.0.0"

include = ["src", "solidity/foundry.toml", "solidity/src", "solidity/out"]

[lib]

[features]
bind = ["alloy/contract"]

[build-dependencies]
foundry-compilers = { version = "0.11.1", features = ["svm-solc"] }
foundry-config = "0.2.0"

[dependencies]
cosmwasm-schema = { path = "../../../ZK/cw/zk-cosmwasm/packages/schema" }
cosmwasm-std = { path = "../../../ZK/cw/zk-cosmwasm/packages/std", features = ["stargate"] }
cw-storage-plus = { path = "../../../ZK/cw/zk-storage-plus" }
cw-utils = { path = "../../../ZK/cw/zk-cw-minus/packages/cw-utils" }
cw2 = { path = "../../../ZK/cw/zk-cw-minus/packages/cw2" }
thiserror = "1.0.31"
alloy = "1.0.25"    
alloy-sol-types = "1.3.1"  

cw-asset = { path = "../../../cw-asset" }