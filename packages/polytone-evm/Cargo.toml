[package]
name = "polytone-evm"
authors = ["ekez <ekez@withoutdoing.com>"]
description = "Core interfaces for Polytone Interchain accounts and queries."
edition = "2021"
license = "BSD-3-Clause"
version = "2.0.0"

include = ["src", "solidity/foundry.toml", "solidity/src", "solidity/out"]

[lib]

[features]
bind = ["alloy/contract"]

[build-dependencies]
foundry-compilers = { version = "0.11.1", features = ["svm-solc"] }
foundry-config = "0.2.0"

[dependencies]
cosmwasm-schema = "3.0.4"
cosmwasm-std = { version = "3.0.4", features = ["stargate"] }
cw-storage-plus = "3.0.1"
cw-utils = "3.0.0"
cw2 = "3.0.0"
thiserror = "1.0.31"
alloy = "1.0.25"    
alloy-sol-types = "1.3.1"  

cw-asset = { version = "4.0.0", git = "https://github.com/permissionlessweb/cw-asset" }