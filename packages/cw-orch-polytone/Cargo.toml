[package]
name = "abstract-cw-orch-polytone"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version = "6.0.1"
description = "CW Orchestrator interfaces for Polytone"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

cw-orch = { workspace = true, features = ["daemon"] }
cosmwasm-std = { workspace = true }
polytone-note = { workspace = true }
polytone-proxy = { workspace = true }
polytone-voice = { workspace = true }
# core traits only. The daemon feature also turns on cw-orch-starship,
# which pulls ibc-relayer and a yanked crates.io dep. Library code uses core::.
cw-orch-interchain = { workspace = true }
clap = { version = "4.0.32", features = ["derive"] }
dotenv = "0.15.0"
env_logger = "0.10.2"
log = "0.4.22"

[dev-dependencies]
anyhow.workspace = true
