[package]
name = "evm-note"
authors = ["ekez <ekez@withoutdoing.com>"]
description = "Sends messages to be executed on other chains over IBC."
version = "0.3.1"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# disables #[entry_point] (i.e. instantiate/execute/query) export
library = []

[dependencies]
cw-orch = { workspace = true }
polytone-evm = { workspace = true }

alloy = {path = "../../../../alloy/crates/alloy"}
alloy-sol-types = "1.3.1"  
cosmwasm-schema = { workspace = true }
cosmwasm-std = { workspace = true, features = ["stargate"] }
cw-storage-plus = { workspace = true }
cw-utils = { workspace = true }
cw2 = { path = "../../../../cw-minus/packages/cw2" }
thiserror = "1.0.31"

cw-asset = { path = "../../../../cw-asset" }

[dev-dependencies]
anyhow = "1.0.86"
cw-multi-test = { package = "abstract-cw-multi-test", path = "../../../../cw-multi-test-fork" }
evm-note = { path = "." }

# This is here inspite of the warnings to make sure it is not missed
# if the contract is taken out of the workspace
[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = true   # very important, do not turn these off.
panic = 'abort'
rpath = false
